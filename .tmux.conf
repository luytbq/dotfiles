set -g base-index 1

# remap prefix
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Enable mouse control (clickable windows, panes, resizeable panes)
set -g mouse on

# Copy mode 
setw -g mode-keys vi
# set -s copy-command 'xclip -selection clipboard' # don't seem to work on Mac

 # set copy to system clipboard
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'


# fro nvim compatible
set-option -sg escape-time 10
set-option -sg focus-events on

#   styling
#set inactive/active window styles
set -g window-style 'fg=colour247,bg=colour236'
set -g window-active-style 'fg=colour250,bg=black'
# set the pane border colors 
set -g pane-border-style 'fg=colour235,bg=colour238' 
set -g pane-active-border-style 'fg=colour51,bg=colour236'
# set -g pane-border-lines heavy

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


# Swap pane
# bind > swap-pane -D       # swap current pane with the next one
# bind < swap-pane -U       # swap current pane with the previous one

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Move window up/down in list
bind Up swap-window -t -1 \; select-window -t -1
bind Down swap-window -t +1 \; select-window -t +1

# Stop rename windows automatically
set -g allow-rename off

# Extend status left length
set -g status-left-length 50

# Active Claude account usage from cswap; the script caches for 60s.
# Hosts without cswap keep tmux's default status-right (pane title, clock).
if-shell 'command -v cswap >/dev/null || [ -x "$HOME/.local/bin/cswap" ]' \
    "set -g status-right '#(~/.tmux/scripts/cswap-status.sh) ' \; set -g status-right-length 90"

bind-key s display-popup -E -w 80% -h 80% "tswitch"
bind-key -T prefix l run-shell "tswitch last"
bind-key f display-popup -E -w 80% -h 80% "tswitch browse"
bind-key -r y run-shell "tswitch gotomark Y"
bind-key -r u run-shell "tswitch gotomark U"
bind-key -r i run-shell "tswitch gotomark I"
bind-key -r o run-shell "tswitch gotomark O"
bind-key -r t run-shell "tswitch gotomark T"
bind-key -r r run-shell "tswitch gotomark R"
bind-key p display-popup -E -w 80% -h 80% "procsweep"

# ensure tmux loads bash as a login shell:
set -g default-command "${SHELL} -l"

bind-key e display-popup -E -w 90% -h 90% "~/.tmux/tool_launcher.sh"
bind-key g display-popup -E -w 90% -h 90% "~/.tmux/tools/quick_search.sh"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# plugin keymap
set-option -g @ssh-split-keep-cwd "true"
set-option -g @ssh-split-keep-remote-cwd "true"
set-option -g @ssh-split-h-key "h"
set-option -g @ssh-split-v-key "v"

set -g @plugin 'luytbq/tmux-ssh-split'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
